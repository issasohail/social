<div class="setting-card" data-url="{% url 'setting_list_crud' category %}"><h3>{{ title }}</h3><div class="setting-list">{% for value in values %}<div class="setting-row"><span>{{ forloop.counter }}</span><input class="setting-value" data-index="{{ forloop.counter0 }}" value="{{ value }}"><button type="button" class="setting-delete" data-index="{{ forloop.counter0 }}">Delete</button></div>{% empty %}<span class="muted">No options yet.</span>{% endfor %}</div><div class="setting-add"><input class="setting-new" placeholder="New {{ title|lower }} value"><button type="button" class="primary setting-add-btn">Add</button></div><div class="setting-save-state"></div></div>
