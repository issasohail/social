<div class="reference-pane" data-category="{{ category }}" {% if category != 'education' %}hidden{% endif %}><div class="reference-head"><h3>{{ title }}</h3><button type="button" class="primary show-add">+ Add {{ title|slice:':-1' }}</button></div><div class="add-row" hidden><input class="setting-new" placeholder="New value"><button type="button" class="primary setting-add-btn">Add</button></div><div class="setting-save-state"></div><table class="reference-table"><thead><tr><th>#</th><th>{{ title }}</th><th>Actions</th></tr></thead><tbody>{% for value in values %}<tr><td>{{ forloop.counter }}</td><td class="reference-value" data-index="{{ forloop.counter0 }}" data-value="{{ value }}">{{ value }}</td><td><button type="button" class="secondary setting-edit" data-index="{{ forloop.counter0 }}">Edit</button> <button type="button" class="danger setting-delete" data-index="{{ forloop.counter0 }}">Delete</button></td></tr>{% empty %}<tr><td colspan="3" class="muted">No options yet.</td></tr>{% endfor %}</tbody></table></div>
