{% extends 'base.html' %}{% block title %}Profile | Social Welfare{% endblock %}{% block content %}
<section class="page-head"><p class="eyebrow">MY ACCOUNT</p><h1>Profile</h1></section><section class="panel form-panel"><form method="post">{% csrf_token %}<div class="form-row"><div class="form-field"><label>Username</label><input value="{{ profile_user.username }}" disabled></div><div class="form-field"><label>First name</label><input name="first_name" value="{{ profile_user.first_name }}"></div><div class="form-field"><label>Last name</label><input name="last_name" value="{{ profile_user.last_name }}"></div><div class="form-field"><label>Email</label><input type="email" name="email" value="{{ profile_user.email }}"></div></div><div class="form-actions"><button class="primary">Save Profile</button></div></form></section>
{% endblock %}
