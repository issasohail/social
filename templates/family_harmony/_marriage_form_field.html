<div class="mpf-field{% if css %} {{ css }}{% endif %}">
  {% if css == "mpf-seg" %}<span class="mpf-field-label">{% if label %}{{ label }}{% else %}{{ field.label }}{% endif %}{% if field.field.required %}<span class="required">*</span>{% endif %}</span>{% else %}<label for="{{ field.id_for_label }}">{% if label %}{{ label }}{% else %}{{ field.label }}{% endif %}{% if field.field.required %}<span class="required">*</span>{% endif %}</label>{% endif %}
  {{ field }}{{ field.errors }}{% if status_id %}<small id="{{ status_id }}"></small>{% endif %}
</div>
