{% if page_obj.paginator.num_pages > 1 %}
<nav class="pagination" aria-label="Pagination">
  {% if page_obj.has_previous %}<a href="?page={{ page_obj.previous_page_number }}&q={{ query }}&gender={{ gender }}&city={{ city }}&status={{ status }}&profession={{ profession }}&portfolio={{ portfolio }}&local_council={{ local_council }}&jamatkhana={{ jamatkhana }}">Previous</a>{% endif %}
  <span>Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>
  {% if page_obj.has_next %}<a href="?page={{ page_obj.next_page_number }}&q={{ query }}&gender={{ gender }}&city={{ city }}&status={{ status }}&profession={{ profession }}&portfolio={{ portfolio }}&local_council={{ local_council }}&jamatkhana={{ jamatkhana }}">Next</a>{% endif %}
</nav>
{% endif %}
