<div class="public-marriage-actions" data-invitation-url="{% url 'create_form_invitation' %}?format=json" aria-label="Public marriage form actions">
  <button type="button" class="public-marriage-main" data-public-form-action="open"><span aria-hidden="true">&#128279;</span> Registration</button><button type="button" class="public-marriage-icon" data-public-form-action="copy" title="Copy public form link" aria-label="Copy public form link">&#128203;</button><button type="button" class="public-marriage-icon" data-public-form-action="whatsapp" title="Share via WhatsApp" aria-label="Share via WhatsApp">&#128172;</button>
</div>
<script>(function(){const group=document.currentScript.previousElementSibling;if(!group||group.dataset.bound)return;group.dataset.bound='1';let invitation;const get=()=>invitation||(invitation=fetch(group.dataset.invitationUrl).then(r=>{if(!r.ok)throw Error();return r.json()}));group.querySelectorAll('[data-public-form-action]').forEach(button=>button.addEventListener('click',async()=>{const original=button.textContent;button.disabled=true;try{const links=await get(),action=button.dataset.publicFormAction;if(action==='open')window.open(links.public_url,'_blank','noopener');if(action==='whatsapp')window.open(links.whatsapp_url,'_blank','noopener');if(action==='copy'){const area=document.createElement('textarea');area.value=links.public_url;document.body.append(area);area.select();document.execCommand('copy');area.remove();button.textContent='✓';setTimeout(()=>button.textContent=original,1200)}}catch(e){button.textContent='!';setTimeout(()=>button.textContent=original,1200)}finally{button.disabled=false}}))})();</script>
